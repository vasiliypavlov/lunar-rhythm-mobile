<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" font-family="DejaVu Sans, Arial, sans-serif">
  
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="earthGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1160" height="470" fill="#0B132B"/>
  <rect width="1160" height="470" fill="url(#grid)"/>

  <text x="50" y="46" fill="#F8FAFC" font-size="20" font-weight="700">КАЛЕНДАРНЫЕ И ЛУННЫЕ СУТКИ: ПОЧЕМУ В ОДНОМ ДНЕ ИХ ДВОЕ</text>
  <text x="50" y="70" fill="#94A3B8" font-size="13">Отсчёт лунных суток по восходам Луны (~24 ч 50 мин) и привязка к окнам активности (09:00 / 14:00 / 20:00)</text>

  <text x="50" y="150" fill="#E2E8F0" font-size="13" font-weight="700">КАЛЕНДАРЬ</text>
  <text x="50" y="168" fill="#64748B" font-size="12">24 ч 00 мин</text>

  <text x="50" y="282" fill="#E2E8F0" font-size="13" font-weight="700">ЛУННЫЕ СУТКИ</text>
  <text x="50" y="300" fill="#64748B" font-size="12">~24 ч 50 мин</text>

  <g transform="translate(190, 120)">
    <rect x="0" y="0" width="300" height="64" fill="#111C3A" stroke="#334155" stroke-width="1.5"/>
    <text x="150" y="26" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">ДЕНЬ 1</text>

    <rect x="300" y="0" width="300" height="64" fill="#172554" stroke="#60A5FA" stroke-width="1.8"/>
    <text x="450" y="23" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">ДЕНЬ 2 (Стыковка суток)</text>

    <rect x="600" y="0" width="300" height="64" fill="#111C3A" stroke="#334155" stroke-width="1.5"/>
    <text x="750" y="26" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">ДЕНЬ 3</text>

    <line x1="0" y1="-12" x2="0" y2="230" stroke="#475569" stroke-width="1"/>
    <text x="0" y="-18" fill="#94A3B8" font-size="11" text-anchor="middle">00:00</text>

    <line x1="300" y1="-12" x2="300" y2="230" stroke="#64748B" stroke-width="1.2"/>
    <text x="300" y="-18" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">00:00</text>

    <line x1="600" y1="-12" x2="600" y2="230" stroke="#64748B" stroke-width="1.2"/>
    <text x="600" y="-18" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle">00:00</text>

    <line x1="900" y1="-12" x2="900" y2="230" stroke="#475569" stroke-width="1"/>
    <text x="900" y="-18" fill="#94A3B8" font-size="11" text-anchor="middle">00:00</text>

    <line x1="412" y1="48" x2="412" y2="165" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="412" cy="48" r="6" fill="#38BDF8"/>
    <text x="412" y="39" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">09:00</text>

    <line x1="475" y1="48" x2="475" y2="165" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="475" cy="48" r="6" fill="#38BDF8"/>
    <text x="475" y="39" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">14:00</text>

    <line x1="550" y1="48" x2="550" y2="165" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="550" cy="48" r="6" fill="#F59E0B"/>
    <text x="550" y="39" fill="#F59E0B" font-size="11" font-weight="700" text-anchor="middle">20:00</text>
  </g>

  <g transform="translate(190, 250)">
    <rect x="75" y="0" width="112" height="58" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="131" y="25" fill="#E2E8F0" font-size="11.5" font-weight="700" text-anchor="middle">1-е лунные</text>
    <text x="131" y="42" fill="#94A3B8" font-size="10.5" text-anchor="middle">(короткие)</text>

    <rect x="187" y="0" width="310" height="58" fill="url(#blueGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="342" y="25" fill="#F8FAFC" font-size="12.5" font-weight="700" text-anchor="middle">2-е лунные сутки</text>
    <text x="342" y="43" fill="#7DD3FC" font-size="11" text-anchor="middle">Утро и день (09:00, 14:00)</text>

    <rect x="497" y="0" width="310" height="58" fill="url(#amberGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="652" y="25" fill="#F8FAFC" font-size="12.5" font-weight="700" text-anchor="middle">3-и лунные сутки</text>
    <text x="652" y="43" fill="#FCD34D" font-size="11" text-anchor="middle">Вечер (20:00) и следующее утро</text>

    <rect x="807" y="0" width="93" height="58" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="853" y="33" fill="#94A3B8" font-size="11.5" font-weight="600" text-anchor="middle">4-е...</text>

    <circle cx="75" cy="0" r="7" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
    <text x="75" y="-14" fill="#94A3B8" font-size="10.5" font-weight="600" text-anchor="middle">Новолуние</text>

    <circle cx="187" cy="0" r="7" fill="#F59E0B"/>
    <text x="187" y="-14" fill="#FCD34D" font-size="10.5" font-weight="600" text-anchor="middle">Восход 15:00</text>

    <line x1="497" y1="-22" x2="497" y2="76" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="497" cy="0" r="8" fill="#F59E0B"/>
    <text x="497" y="-14" fill="#F59E0B" font-size="11" font-weight="700" text-anchor="middle">Восход 15:50 (Смена)</text>

    <circle cx="807" cy="0" r="7" fill="#F59E0B"/>
    <text x="807" y="-14" fill="#FCD34D" font-size="10.5" font-weight="600" text-anchor="middle">Восход 16:40</text>

    <path d="M 300 74 L 300 88 L 600 88 L 600 74" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="450" y="110" fill="#E2E8F0" font-size="12.5" font-weight="600" text-anchor="middle">В пределах одного Дня 2 идут двое лунных суток: 2-е (до восхода в 15:50) и 3-и (после 15:50)</text>
  </g>
</svg>