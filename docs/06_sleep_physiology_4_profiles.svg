  <!-- Header -->
  <text
     x="50"
     y="44"
     fill="#F8FAFC"
     font-size="19"
     font-weight="700"
     id="text5">ВЛИЯНИЕ ЛУНЫ НА ЧЕЛОВЕКА: ФИЗИОЛОГИЯ И МОДЕЛЬ ПРИЛОЖЕНИЯ</text>
  <text
     x="50"
     y="66"
     fill="#94A3B8"
     font-size="12.5"
     id="text6">Доказанные эффекты ночного света (Casiraghi 2021, Cajochen 2013) и 4 базовых профиля ритма</text>
  <!-- SECTION A: SCIENCE (LIGHT VS GRAVITY) -->
  <text
     x="50"
     y="106"
     fill="#38BDF8"
     font-size="14"
     font-weight="700"
     id="text7">А. ЧТО ПОДТВЕРЖДАЕТ НАУКА (СВЕТ ПРОТИВ МИФА О ГРАВИТАЦИИ)</text>
  <!-- Card A1: Circadian Light Effect (Proven) -->
  <rect
     x="50"
     y="122"
     width="535"
     height="205"
     rx="10"
     fill="#111c3a"
     stroke="#38bdf8"
     stroke-width="1.5"
     id="rect7" />
  <rect
     x="63.376953"
     y="140"
     width="495"
     height="24"
     rx="4"
     fill="#0284c7"
     opacity="0.35"
     id="rect8" />
  <text
     x="189.39868"
     y="156"
     fill="#7dd3fc"
     font-size="11px"
     font-weight="700"
     text-anchor="middle"
     id="text8">ПОДТВЕРЖДЕНО ИССЛЕДОВАНИЯМИ</text>
  <text
     x="70"
     y="188"
     fill="#f8fafc"
     font-size="15px"
     font-weight="700"
     id="text9">Ночной свет и циркадные ритмы</text>
  <text
     x="70"
     y="212"
     fill="#cbd5e1"
     font-size="12px"
     id="text10">• За 3–5 ночей до полнолуния яркая Луна светит вечером</text>
  <text
     x="80"
     y="229"
     fill="#cbd5e1"
     font-size="12px"
     id="text11">сразу после заката, сдвигая время засыпания на более позднее.</text>
  <text
     x="70"
     y="253"
     fill="#fcd34d"
     font-size="12.5px"
     font-weight="700"
     id="text12">• Сокращение сна в среднем на 20–25 минут</text>
  <text
     x="80"
     y="270"
     fill="#94a3b8"
     font-size="11.5px"
     id="text13">и снижение доли глубокого сна (в городе эффект маскируется</text>
  <text
     x="80"
     y="286"
     fill="#94a3b8"
     font-size="11.5px"
     id="text14">искусственным освещением и экранами).</text>
  <text
     x="70"
     y="310"
     fill="#64748b"
     font-size="10.5px"
     id="text15">Источники: Casiraghi et al., Science Advances (2021); Cajochen et al., Current Biology (2013)</text>
  <!-- Card A2: Gravity Myth (Debunked) -->
  <rect
     x="615"
     y="122"
     width="535"
     height="205"
     rx="10"
     fill="#111c3a"
     stroke="#475569"
     stroke-width="1.5"
     id="rect15" />
  <rect
     x="628.37695"
     y="140"
     width="495"
     height="24"
     rx="4.0824742"
     fill="#f59e0b"
     opacity="0.22"
     id="rect16"
     style="stroke-width:1.01026" />
  <text
     x="722.38965"
     y="156"
     fill="#fcd34d"
     font-size="11px"
     font-weight="700"
     text-anchor="middle"
     id="text16">РАСПРОСТРАНЁННЫЙ МИФ</text>
  <text
     x="635"
     y="188"
     fill="#f8fafc"
     font-size="15px"
     font-weight="700"
     id="text17">Гравитация и «приливы в организме»</text>
  <text
     x="635"
     y="212"
     fill="#cbd5e1"
     font-size="12px"
     id="text18">• Приливы в Мировом океане возникают только из-за</text>
  <text
     x="645"
     y="229"
     fill="#cbd5e1"
     font-size="12px"
     id="text19">огромной протяжённости водных масс в масштабе планеты.</text>
  <text
     x="635"
     y="253"
     fill="#e2e8f0"
     font-size="12px"
     font-weight="600"
     id="text20">• В масштабе тела человека градиент ничтожен:</text>
  <text
     x="645"
     y="270"
     fill="#94a3b8"
     font-size="11.5px"
     id="text21">гравитационное притяжение Луны слабее, чем притяжение</text>
  <text
     x="645"
     y="286"
     fill="#94a3b8"
     font-size="11.5px"
     id="text22">от рядом стоящего здания или автомобиля.</text>
  <text
     x="635"
     y="310"
     fill="#7dd3fc"
     font-size="11px"
     font-weight="600"
     id="text23">Вывод: физический фактор — свет и режим сна, а не «притяжение воды».</text>
