<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="DejaVu Sans, Arial, sans-serif">
  
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="earthGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="620" fill="#0B132B"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <!-- Header -->
  <text x="45" y="44" fill="#F8FAFC" font-size="19" font-weight="700">ВРЕМЯ ВОСХОДА ЛУНЫ: ОРБИТАЛЬНОЕ ЗАПАЗДЫВАНИЕ И ШИРОТА 50,0° С.Ш.</text>
  <text x="45" y="66" fill="#94A3B8" font-size="12.5">Почему восход сдвигается на ~50 минут в сутки и какие поправки учитывает движок astro_engine.js</text>

  <!-- Vertical Split -->
  <line x1="590" y1="95" x2="590" y2="585" stroke="#334155" stroke-width="1.5"/>

  <!-- LEFT PANEL -->
  <text x="45" y="108" fill="#38BDF8" font-size="14" font-weight="700">I. МЕХАНИЗМ СДВИГА ВОСХОДА (~50 МИНУТ)</text>

  <g transform="translate(295, 345)">
    <circle cx="0" cy="0" r="185" fill="none" stroke="#475569" stroke-width="1.5"/>

    <path d="M 0 0 L 0 -185 A 185 185 0 0 1 86 -164 Z" fill="#F59E0B" opacity="0.22"/>
    <line x1="0" y1="0" x2="0" y2="-185" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="0" y1="0" x2="86" y2="-164" stroke="#F59E0B" stroke-width="1.8"/>

    <circle cx="0" cy="0" r="54" fill="url(#earthGrad)" stroke="#7DD3FC" stroke-width="1.5"/>
    <path d="M -38 -52 A 64 64 0 1 0 38 -52" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="0" y="78" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">1 оборот Земли (360°)</text>
    <text x="-74" y="5" fill="#E2E8F0" font-size="13" font-weight="700" text-anchor="end">ЗЕМЛЯ</text>

    <circle cx="0" cy="-54" r="4.5" fill="#F8FAFC"/>
    <circle cx="24" cy="-48" r="4.5" fill="#F59E0B"/>

    <circle cx="0" cy="-185" r="15" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="-16" y="-204" fill="#94A3B8" font-size="11.5" font-weight="600" text-anchor="end">Луна (День N)</text>

    <circle cx="86" cy="-164" r="16" fill="#E2E8F0" stroke="#F59E0B" stroke-width="2"/>
    <text x="108" y="-170" fill="#F8FAFC" font-size="12" font-weight="700">Луна (День N+1)</text>
    <text x="108" y="-153" fill="#FCD34D" font-size="11.5" font-weight="600">Смещение на восток: 12–13°</text>

    <path d="M 14 -198 A 198 198 0 0 1 78 -182" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="65" y="-58" width="185" height="66" rx="8" fill="#111C3A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="157" y="-33" fill="#F59E0B" font-size="14" font-weight="700" text-anchor="middle">+50 мин в среднем</text>
    <text x="157" y="-14" fill="#CBD5E1" font-size="11" text-anchor="middle">Доворот Земли (диапазон</text>
    <text x="157" y="1" fill="#CBD5E1" font-size="11" text-anchor="middle">от ~20 до ~80+ минут)</text>
  </g>

  <!-- RIGHT PANEL -->
  <text x="625" y="108" fill="#38BDF8" font-size="14" font-weight="700">II. ДОПУЩЕНИЕ ШИРОТЫ (50,0° С.Ш.) И ГОРИЗОНТ</text>

  <g transform="translate(730, 315)">
    <circle cx="0" cy="0" r="105" fill="#111C3A" stroke="#475569" stroke-width="1.5"/>
    <path d="M -105 0 Q 0 24 105 0" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="-95" y="18" fill="#64748B" font-size="10">Экватор (0°)</text>

    <path d="M -82 -65 Q 0 -46 82 -65" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="28" cy="-56" r="5" fill="#F59E0B"/>
    <text x="0" y="-76" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">50,0° с.ш. (Опорная широта)</text>

    <rect x="-105" y="125" width="225" height="122" rx="8" fill="#111C3A" stroke="#334155" stroke-width="1.2"/>
    <text x="-92" y="147" fill="#F8FAFC" font-size="11.5" font-weight="700">География сверки:</text>
    <text x="-92" y="166" fill="#7DD3FC" font-size="10.5">• 45–54° с.ш. (Киев, Прага,</text>
    <text x="-84" y="180" fill="#7DD3FC" font-size="10.5">Франкфурт): расчёт точен.</text>
    <text x="-92" y="200" fill="#FCD34D" font-size="10.5">• Севернее (Москва 55,7°, СПб 60°)</text>
    <text x="-84" y="214" fill="#FCD34D" font-size="10.5">или южнее: сдвиг на десятки</text>
    <text x="-84" y="228" fill="#FCD34D" font-size="10.5">минут от реального горизонта.</text>
  </g>

  <g transform="translate(1025, 330)">
    <circle cx="0" cy="0" r="135" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <line x1="0" y1="65" x2="0" y2="-110" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowSlate)"/>
    <text x="0" y="-116" fill="#94A3B8" font-size="11" font-weight="700" text-anchor="middle">ЗЕНИТ</text>

    <path d="M -126 48 Q 0 18 126 48 L 116 74 Q 0 44 -116 74 Z" fill="#38BDF8" opacity="0.18"/>
    <line x1="-122" y1="62" x2="122" y2="62" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="-112" y="54" fill="#E2E8F0" font-size="10.5" font-weight="600">Геометрический горизонт</text>

    <circle cx="52" cy="76" r="13" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3,2"/>
    <text x="48" y="103" fill="#94A3B8" font-size="10" text-anchor="middle">Истинное положение</text>

    <circle cx="52" cy="36" r="13" fill="#E2E8F0" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="52" y="16" fill="#F8FAFC" font-size="10.5" font-weight="700" text-anchor="middle">Видимый диск (R=0,25°)</text>

    <line x1="72" y1="74" x2="72" y2="40" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <text x="12" y="28" fill="#FCD34D" font-size="10" font-weight="600" text-anchor="end">Рефракция</text>
    <text x="12" y="40" fill="#FCD34D" font-size="10" font-weight="600" text-anchor="end">0,5667°</text>

    <text x="0" y="122" fill="#7DD3FC" font-size="10.5" font-weight="600" text-anchor="middle">Горизонтальный параллакс: ~1°</text>
  </g>
</svg>